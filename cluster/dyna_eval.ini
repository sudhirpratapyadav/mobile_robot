[base]
env_name = dyna_eval
checkpoint_dir = /puffertank/host/dyna_barn/runs/eval
checkpoint_interval = 999999999

[vec]
total_agents = 64
num_buffers = 1
num_threads = 2

[env]
arena_size = 20.0
max_steps = 600
dt = 0.1
difficulty = 0
world_seed_base = 0
gamma_d = 1.0
beta = 1.0
sigma_o = 2.0
success_bonus = 1.0
collision_penalty = 10.0
goal_radius = 0.5
# Corrected paper-eval geometry. open_front=1: no wall on +x side.
# v_max_clip=0.5: cap policy linear velocity at the move_base limit.
# goal_box_half=0.3: L∞-box success per check_goal_node.py.
# a_max=10, alpha_max=20: slew-rate caps from base_local_planner_params.yaml.
open_front = 1
v_max_clip = 0.5
goal_box_half = 0.3
a_max = 10.0
alpha_max = 20.0

[policy]
hidden_size = 128
num_layers = 2

[train]
gpus = 1
seed = 42
total_timesteps = 1
learning_rate = 0.0005
anneal_lr = 0
min_lr_ratio = 1.0
gamma = 0.99
gae_lambda = 0.95
replay_ratio = 1
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 0.2
max_grad_norm = 0.5
ent_coef = 0.0
beta1 = 0.9
beta2 = 0.999
eps = 1e-8
minibatch_size = 1024
horizon = 64
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.0
prio_beta0 = 0.0
use_rnn = 0
