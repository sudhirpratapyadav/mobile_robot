[base]
env_name = dyna_train
checkpoint_dir = /puffertank/host/dyna_barn/runs/train
checkpoint_interval = 100

[vec]
total_agents = 4096
num_buffers = 4
num_threads = 16

[env]
# Arena
arena_size = 20.0
# 80 s episode at dt=0.1 → 800 steps. Travel budget at v_max=0.5: 40 m
# (corner-to-corner of the 20×20 arena ≈ 28 m, so plenty of headroom).
max_steps = 800
dt = 0.1

# Obstacles — broad across count and motion-family. Curriculum is implicit
# in the mixture rather than staged.
num_obstacles_min = 3
num_obstacles_max = 25
# Poly-family params (covers the easy AND hard DynaBARN motion bins now).
order_min = 1
order_max = 5
speed_min = 0.3
speed_max = 2.5
std_min = 0.0
std_max = 0.3

# Motion-family weights (categorical sampler picks one per obstacle).
# Poly-only — matches the DynaBARN published-worlds motion model. Other
# families available for future experiments; set their weight to 1 to enable.
mw_poly          = 1
mw_linear        = 0
mw_reciprocating = 0
mw_sinusoidal    = 0
mw_random_walk   = 0
mw_stationary    = 0

# Sinusoidal-family knobs
amp_max  = 3.0
freq_min = 0.05
freq_max = 0.5
# Random-walk knob
walk_step_std = 0.4
# Reciprocating knob (end-to-end min distance)
reciprocate_min_dist = 4.0

# Velocity envelope applied to the policy output BEFORE jackal_step.
# Matches the paper-eval move_base local-planner max_vel_x = 0.5 m/s so the
# policy learns to be effective within the same kinematic envelope as
# the published-worlds eval. Set train_v_max <= 0 to fall back to
# JACKAL_V_MAX (hardware cap, 2.0 m/s).
train_v_max = 0.5
train_v_min = -0.5
train_w_max = 3.14159265359
# Slew-rate (acceleration) limits on commanded v / w. Matches the paper's
# base_local_planner_params.yaml: acc_lim_x = 10 m/s², acc_lim_theta = 20
# rad/s². Per step the policy can change v by at most a_max*dt and w by at
# most alpha_max*dt. Set ≤ 0 to disable.
train_a_max = 10.0
train_alpha_max = 20.0

# Start/goal sampling
min_init_goal_dist = 12.0

# Reward — multi-scale Gaussian (2026-05-16). Removed Δ-distance,
# obstacle repulsion, time penalty, success bonus. Only signals are:
#   • 3 Gaussian goal-attraction terms at different scales (per step)
#   • per-event collision penalty (only on the step the robot enters
#     a collision; doesn't repeat while stuck)
# Episode runs full max_steps; no termination on goal or collision.
gamma_d = 0.0                 # off
beta = 0.0                    # off
sigma_o = 2.0                 # unused (beta=0)
success_bonus = 0.0           # off
collision_penalty = 1.0       # per-event, applied only on the entering step
goal_radius = 0.5             # legacy Euclidean fallback (used iff goal_box_half ≤ 0)
# Match eval's L∞-box success criterion (paper check_goal_node.py).
# A 0.6×0.6 m box around the goal — stricter than the 0.5 m Euclidean ball.
goal_box_half = 0.3
time_penalty = 0.0            # off
alpha_g = 0.0                 # off (single-scale, deprecated)
sigma_g = 5.0                 # unused

# Three-scale Gaussian goal attraction. r += sum_i α_i · exp(-(d/σ_i)²).
# Distance ranges where each term is ~non-trivial (R = 2σ, where the
# Gaussian falls to ~0.018 of its peak):
#    short  →  R ≈  5 m
#    med    →  R ≈ 20 m
#    long   →  R ≈ 40 m   (covers the whole arena)
alpha_short = 1.0
sigma_short = 2.5
alpha_med   = 1.0
sigma_med   = 10.0
alpha_long  = 1.0
sigma_long  = 20.0

# No termination — episode always runs to max_steps.
terminate_on_goal      = 0
terminate_on_collision = 0

[policy]
hidden_size = 128
num_layers = 2

[torch]
# Egocentric-costmap encoder defined in pufferlib/models.py (appended via
# tools/pufferlib_patch.py). Reshapes the flat (G*G + extras) obs into
# (B, 1, G, G), small CNN, concat extras, MLP head.
encoder = CostmapEncoder64
network = MLP
decoder = DefaultDecoder

[train]
gpus = 1
seed = 42
total_timesteps = 500000000
learning_rate = 0.0005
anneal_lr = 1
min_lr_ratio = 0.1
gamma = 0.99
gae_lambda = 0.95
replay_ratio = 1
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 0.2
max_grad_norm = 0.5
ent_coef = 0.01
beta1 = 0.9
beta2 = 0.999
eps = 1e-8
minibatch_size = 8192
horizon = 64
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.0
prio_beta0 = 0.0
use_rnn = 0
