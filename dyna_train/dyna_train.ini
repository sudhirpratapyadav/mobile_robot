[base]
env_name = dyna_train
checkpoint_dir = /puffertank/host/dyna_barn/runs/train
checkpoint_interval = 100

[vec]
total_agents = 4096
num_buffers = 4
num_threads = 16

[env]
# Arena
arena_size = 20.0
max_steps = 600
dt = 0.1

# Obstacles — broad across count and motion-family. Curriculum is implicit
# in the mixture rather than staged.
num_obstacles_min = 3
num_obstacles_max = 25
# Poly-family params (covers the easy AND hard DynaBARN motion bins now).
order_min = 1
order_max = 5
speed_min = 0.3
speed_max = 2.5
std_min = 0.0
std_max = 0.3

# Motion-family weights (categorical sampler picks one per obstacle).
# Poly-only — matches the DynaBARN published-worlds motion model. Other
# families available for future experiments; set their weight to 1 to enable.
mw_poly          = 1
mw_linear        = 0
mw_reciprocating = 0
mw_sinusoidal    = 0
mw_random_walk   = 0
mw_stationary    = 0

# Sinusoidal-family knobs
amp_max  = 3.0
freq_min = 0.05
freq_max = 0.5
# Random-walk knob
walk_step_std = 0.4
# Reciprocating knob (end-to-end min distance)
reciprocate_min_dist = 4.0

# Velocity envelope applied to the policy output BEFORE jackal_step.
# Matches the paper-eval move_base local-planner max_vel_x = 0.5 m/s so the
# policy learns to be effective within the same kinematic envelope as
# the published-worlds eval. Set train_v_max <= 0 to fall back to
# JACKAL_V_MAX (hardware cap, 2.0 m/s).
train_v_max = 0.5
train_v_min = -0.5
train_w_max = 3.14159265359
# Slew-rate (acceleration) limits on commanded v / w. Matches the paper's
# base_local_planner_params.yaml: acc_lim_x = 10 m/s², acc_lim_theta = 20
# rad/s². Per step the policy can change v by at most a_max*dt and w by at
# most alpha_max*dt. Set ≤ 0 to disable.
train_a_max = 10.0
train_alpha_max = 20.0

# Start/goal sampling
min_init_goal_dist = 12.0

# Reward — option C (2026-05-15): lower collision_penalty + add time
# penalty + goal-attraction Gaussian, to fix the do-nothing collapse seen in
# the 5B run (b3vm6fej) under v_max=0.5 + accel limits.
gamma_d = 1.0
beta = 1.0
sigma_o = 2.0
success_bonus = 1.0
collision_penalty = 1.0
goal_radius = 0.5
# Per-step time penalty: -0.005 over 600 steps = -3.0 if doing nothing.
time_penalty = 0.005
# Goal-attraction Gaussian: peaks at +alpha_g when on top of the goal.
# alpha_g=0.05, sigma_g=5 → ~+0.05 when within 5m, ~0 when far.
alpha_g = 0.05
sigma_g = 5.0

[policy]
hidden_size = 128
num_layers = 2

[train]
gpus = 1
seed = 42
total_timesteps = 500000000
learning_rate = 0.0005
anneal_lr = 1
min_lr_ratio = 0.1
gamma = 0.99
gae_lambda = 0.95
replay_ratio = 1
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 0.2
max_grad_norm = 0.5
ent_coef = 0.01
beta1 = 0.9
beta2 = 0.999
eps = 1e-8
minibatch_size = 8192
horizon = 64
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.0
prio_beta0 = 0.0
use_rnn = 0
