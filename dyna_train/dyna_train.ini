[base]
env_name = dyna_train
checkpoint_dir = /puffertank/host/dyna_barn/runs/train
checkpoint_interval = 100

[vec]
total_agents = 4096
num_buffers = 4
num_threads = 16

[env]
# Arena
arena_size = 20.0
max_steps = 600
dt = 0.1

# Obstacles — start with DynaBARN "easy" bin (paper Table I), but smaller
# count so the policy can learn the basics. Curriculum advancement is handled
# in a wrapper script, not here.
num_obstacles_min = 5
num_obstacles_max = 10
order_min = 1
order_max = 2
speed_min = 0.5
speed_max = 1.0
std_min = 0.01
std_max = 0.1

# Start/goal sampling
min_init_goal_dist = 12.0

# Reward
gamma_d = 1.0
beta = 1.0
sigma_o = 2.0
success_bonus = 1.0
collision_penalty = 10.0
goal_radius = 0.5

[policy]
hidden_size = 128
num_layers = 2

[train]
gpus = 1
seed = 42
total_timesteps = 500000000
learning_rate = 0.0005
anneal_lr = 1
min_lr_ratio = 0.1
gamma = 0.99
gae_lambda = 0.95
replay_ratio = 1
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 0.2
max_grad_norm = 0.5
ent_coef = 0.01
beta1 = 0.9
beta2 = 0.999
eps = 1e-8
minibatch_size = 8192
horizon = 64
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.0
prio_beta0 = 0.0
use_rnn = 0
